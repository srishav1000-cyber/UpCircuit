name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: upcircuit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d upcircuit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - name: Disaster-recovery drill (seed → dump → wipe → restore → verify)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client bc
          chmod +x scripts/backup-drill.sh
          ./scripts/backup-drill.sh
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: upcircuit_test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon
      - name: Dependency audit (high+ only, non-blocking for dev deps)
        run: npm audit --omit=dev --audit-level=high || true
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL RLS / RPC tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql postgresql-contrib
          sudo chmod -R a+rX . 
          ./scripts/rls-test.sh
