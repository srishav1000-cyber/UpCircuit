name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon
      - name: Dependency audit (high+ only, non-blocking for dev deps)
        run: npm audit --omit=dev --audit-level=high || true
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL RLS / RPC tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql postgresql-contrib
          sudo chmod -R a+rX . 
          ./scripts/rls-test.sh
